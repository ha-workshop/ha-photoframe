name: Feature request
description: An idea for the frame, the card or the integration
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: What you want to do and why — the use case matters more than the exact solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds or other integrations you tried, if any.
