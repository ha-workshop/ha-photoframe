# Проверки интеграции: hassfest (правила HA для custom_components), HACS, сборка интерфейса из подмодуля.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m py_compile custom_components/photoframe/*.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/build-frontend.sh zip
