# При публикации релиза: версия из тега → manifest.json, интерфейс из подмодуля frontend/ → в интеграцию,
# всё вместе — photoframe.zip к релизу. HACS (zip_release) ставит именно его.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/photoframe/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/photoframe/manifest.json
      - run: scripts/build-frontend.sh zip
      - uses: softprops/action-gh-release@v2
        with:
          files: photoframe.zip
